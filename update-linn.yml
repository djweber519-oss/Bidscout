name: Check Linn County bids
on:
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Linn County public bids
        run: python scripts/update_linn.py
      - name: Save results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/linn_bids.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Linn County bid check'
            git push
          fi
