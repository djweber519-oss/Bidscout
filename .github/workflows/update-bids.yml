name: Update federal bids
on:
  schedule:
    - cron: '17 12 * * *' # 12:17 UTC daily; GitHub schedule may be delayed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bidscout-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public SAM.gov opportunities
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python scripts/update_bids.py
      - name: Commit changed public data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282舫憹actions[bot]@users.noreply.github.com"
          git add data/bids.json
          if ! git diff --cached --quiet; then
            git commit -m "Update SAM.gov opportunity data"
            git push
          fi
