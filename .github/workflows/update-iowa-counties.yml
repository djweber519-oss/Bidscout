name: Check Iowa county bid feeds
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified county feeds
        run: python scripts/update_iowa_counties.py
      - name: Commit updated county data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iowa_county_bids.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Iowa county bid feed results"
            git push
          fi
